<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightjar India Portal</title>
<!-- The whole portal in one file: every page, the styling, the scripts and all 209 records. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500..800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
/* Nightjar India Portal
   Palette comes from how nightjars are actually found: a dark road, a torch beam, one amber eye. */
:root {
  --night: #141a2e;      /* sky after dusk */
  --dusk: #2b2f55;       /* last light */
  --moon: #edeff5;       /* page ground */
  --paper: #ffffff;
  --ink: #171b2b;
  --muted: #565d75;
  --line: #d3d7e3;
  --eye: #f2a93b;        /* eyeshine */
  --eye-deep: #a8660a;   /* eyeshine, readable on light */
  --bark: #7a6248;       /* plumage */
  --ok: #2f6b55;
  --bad: #a8322d;
  --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r: 6px;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--moon); color: var(--ink);
  font: 400 1.0625rem/1.6 var(--body);
  min-height: 100vh; display: flex; flex-direction: column;
}
main { flex: 1; }
img, svg { max-width: 100%; display: block; }
a { color: var(--dusk); text-underline-offset: 3px; }
a:hover { color: var(--eye-deep); }
h1, h2, h3 { font-family: var(--display); line-height: 1.12; margin: 0 0 .5em; letter-spacing: -.015em; text-wrap: balance; }
h1 { font-size: clamp(2.1rem, 5vw, 3.5rem); font-weight: 700; }
h2 { font-size: clamp(1.55rem, 3vw, 2.1rem); font-weight: 650; }
h3 { font-size: 1.15rem; font-weight: 650; }
p { margin: 0 0 1em; max-width: 68ch; }
:focus-visible { outline: 3px solid var(--eye); outline-offset: 2px; border-radius: 2px; }

.wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 0 20px; }
.section { padding: 64px 0; }
.section.tight { padding: 40px 0; }
.on-paper { background: var(--paper); }
.lede { font-size: 1.2rem; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .92rem; }
.hidden { display: none !important; }

/* ---------- Header ---------- */
.skip { position: absolute; left: -999px; top: 0; background: var(--eye); color: var(--ink); padding: 8px 12px; z-index: 50; }
.skip:focus { left: 8px; top: 8px; }
.site-header { background: var(--night); color: #fff; position: sticky; top: 0; z-index: 30; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 16px; min-height: 60px; }
.brand { font-family: var(--display); font-weight: 700; font-size: 1.1rem; color: #fff; text-decoration: none; display: flex; align-items: center; gap: 10px; }
.brand:hover { color: #fff; }
.eye { width: 11px; height: 11px; border-radius: 50%; background: var(--eye); box-shadow: 0 0 0 4px rgba(242,169,59,.22), 0 0 14px 3px rgba(242,169,59,.55); }
#nav { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
#nav a { color: #cfd4e6; text-decoration: none; padding: 8px 12px; border-radius: var(--r); font-size: .98rem; }
#nav a:hover { color: #fff; background: rgba(255,255,255,.08); }
#nav a[aria-current=page] { color: #fff; box-shadow: inset 0 -2px 0 var(--eye); border-radius: 0; }
#nav-user { display: flex; align-items: center; gap: 4px; }
#nav a.nav-cta { color: var(--ink); background: var(--eye); font-weight: 700; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#nav a.nav-cta:hover { background: #ffc266; color: var(--ink); }
.menu-btn { display: none; background: none; border: 1px solid #58608a; color: #fff; padding: 7px 14px; border-radius: var(--r); font: inherit; cursor: pointer; }
.demo-note { background: #fff3d6; border-bottom: 1px solid #e6cf94; font-size: .92rem; padding: 8px 0; }

@media (max-width: 860px) {
  .menu-btn { display: block; }
  #nav { display: none; position: absolute; left: 0; right: 0; top: 60px; background: var(--night); padding: 8px 20px 18px; flex-direction: column; align-items: stretch; }
  #nav.open { display: flex; }
  #nav-user { flex-direction: column; align-items: stretch; }
  #nav a.nav-cta { max-width: none; text-align: center; margin-top: 8px; }
}

/* ---------- Buttons and forms ---------- */
.btn {
  display: inline-block; font: 700 1rem var(--body); cursor: pointer; text-decoration: none; text-align: center;
  padding: 12px 20px; border-radius: var(--r); border: 2px solid var(--night); background: var(--night); color: #fff;
}
.btn:hover { background: var(--dusk); border-color: var(--dusk); color: #fff; }
.btn.amber { background: var(--eye); border-color: var(--eye); color: var(--ink); }
.btn.amber:hover { background: #ffc266; border-color: #ffc266; color: var(--ink); }
.btn.ghost { background: transparent; color: var(--night); }
.btn.ghost:hover { background: var(--night); color: #fff; }
.btn.sm { padding: 7px 12px; font-size: .92rem; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.danger:hover { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .6; cursor: progress; }

label { display: block; font-weight: 700; font-size: .95rem; margin-bottom: 5px; }
.hint { display: block; font-weight: 400; color: var(--muted); font-size: .88rem; }
input, select, textarea {
  width: 100%; font: inherit; color: var(--ink); background: var(--paper);
  border: 1.5px solid #9aa1b8; border-radius: var(--r); padding: 10px 12px;
}
textarea { min-height: 110px; resize: vertical; }
input[type=checkbox] { width: 20px; height: 20px; flex: none; margin-top: 3px; accent-color: var(--dusk); }
input[type=file] { padding: 8px; background: var(--moon); }
.field { margin-bottom: 18px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.check { display: flex; gap: 10px; align-items: flex-start; font-weight: 400; }
.hp { position: absolute; left: -9999px; }
@media (max-width: 640px) { .row2, .row3 { grid-template-columns: 1fr; gap: 0; } }

.panel { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 28px; }
.narrow { max-width: 640px; }
.notice { border-left: 5px solid var(--eye); background: #fff8e8; padding: 14px 18px; border-radius: 0 var(--r) var(--r) 0; margin-bottom: 20px; }
.notice.ok { border-color: var(--ok); background: #e9f3ee; }
.notice.bad { border-color: var(--bad); background: #f9e9e8; }
.notice p:last-child { margin-bottom: 0; }

.tag { display: inline-block; font-size: .82rem; font-weight: 700; padding: 2px 9px; border-radius: 99px; background: var(--moon); color: var(--dusk); border: 1px solid var(--line); }
.tag.guj { background: #fff1d3; border-color: #ebca85; color: #6d4405; }
.tag.pending, .tag.new { background: #fff1d3; border-color: #ebca85; color: #6d4405; }
.tag.approved, .tag.accepted { background: #e2f0e9; border-color: #a9cdbb; color: #1e4c3b; }
.tag.rejected { background: #f9e4e2; border-color: #e2b0ac; color: #7c221e; }

#toast {
  position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; pointer-events: none;
  background: var(--night); color: #fff; padding: 12px 20px; border-radius: var(--r); max-width: min(90vw, 520px);
  transition: opacity .2s, transform .2s; z-index: 100; border-left: 5px solid var(--eye);
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { border-left-color: #ff7a73; }

/* ---------- Home: hero ---------- */
.hero { background: linear-gradient(180deg, var(--night) 0%, #1b2140 62%, var(--dusk) 100%); color: #fff; overflow: hidden; }
.hero-grid { display: grid; grid-template-columns: 1.15fr .85fr; gap: 32px; align-items: end; padding-top: 64px; }
.hero-copy { padding-bottom: 64px; }
.hero h1 { color: #fff; max-width: 15ch; }
.hero .lede { color: #c5cbe2; max-width: 46ch; }
.hero-search { display: flex; gap: 8px; margin: 28px 0 16px; max-width: 520px; }
.hero-search input { border-color: transparent; padding: 14px 16px; }
.hero-search .btn { white-space: nowrap; }
.hero-facts { color: #c5cbe2; font-size: .98rem; margin: 0; }
.hero-facts b { color: var(--eye); font-family: var(--display); font-size: 1.15rem; }
.scene { width: 100%; height: auto; align-self: end; }
.scene .beam { transform-origin: 40px 250px; animation: sweep 1.6s cubic-bezier(.2,.7,.2,1) both; }
.scene .shine { animation: lightup .5s 1.5s both; }
.scene .halo { animation: lightup .9s 1.5s both; }
@keyframes sweep { from { transform: rotate(-26deg); opacity: 0; } to { transform: rotate(0); opacity: 1; } }
@keyframes lightup { from { opacity: 0; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .scene .beam, .scene .shine, .scene .halo { animation: none; } html { scroll-behavior: auto; } }
@media (max-width: 860px) {
  .hero-grid { grid-template-columns: 1fr; padding-top: 44px; gap: 0; }
  .hero-copy { padding-bottom: 20px; }
  .hero-search { flex-direction: column; }
}

/* ---------- Home: sections ---------- */
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; align-items: start; }
@media (max-width: 860px) { .split { grid-template-columns: 1fr; gap: 28px; } }

.bars { list-style: none; margin: 0; padding: 0; }
.bars li { display: grid; grid-template-columns: 11.5em 1fr 3em; gap: 12px; align-items: center; padding: 7px 0; font-size: .98rem; }
.bars .track { height: 12px; background: var(--moon); border-radius: 99px; overflow: hidden; }
.bars .fill { display: block; height: 100%; min-width: 4px; background: var(--bark); border-radius: 99px; }
.bars .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
@media (max-width: 480px) { .bars li { grid-template-columns: 8.5em 1fr 2.5em; font-size: .9rem; } }

.grant { background: var(--night); color: #fff; }
.grant h2 { color: #fff; }
.grant p { color: #d5d9ea; }
.grant a { color: var(--eye); }
.grant blockquote { margin: 0; padding: 22px 24px; border-left: 5px solid var(--eye); background: rgba(255,255,255,.06); border-radius: 0 var(--r) var(--r) 0; font-family: var(--display); font-size: 1.2rem; line-height: 1.35; }
.grant blockquote footer { font-family: var(--body); font-size: .92rem; color: #b9c0dc; margin-top: 12px; }

.steps { list-style: none; counter-reset: s; margin: 28px 0 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; }
.steps li { counter-increment: s; border-top: 3px solid var(--night); padding-top: 14px; }
.steps li::before { content: counter(s); font: 700 2rem var(--display); color: var(--eye-deep); display: block; line-height: 1; margin-bottom: 8px; }
.steps p { margin: 0; color: var(--muted); }
@media (max-width: 760px) { .steps { grid-template-columns: 1fr; } }

.species { list-style: none; margin: 24px 0 0; padding: 0; columns: 2; column-gap: 48px; }
.species li { break-inside: avoid; padding: 13px 0; border-bottom: 1px solid var(--line); }
.species b { font-family: var(--display); font-size: 1.08rem; }
.species i { color: var(--bark); margin-left: 6px; }
.species span { display: block; color: var(--muted); font-size: .95rem; }
@media (max-width: 760px) { .species { columns: 1; } }

.two-cta { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.two-cta .panel { display: flex; flex-direction: column; align-items: flex-start; }
.two-cta .panel p { flex: 1; }
@media (max-width: 760px) { .two-cta { grid-template-columns: 1fr; } }

/* ---------- Page heads ---------- */
.page-head { background: var(--night); color: #fff; padding: 44px 0 36px; }
.page-head h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); margin-bottom: .3em; }
.page-head p { color: #c5cbe2; margin: 0; }

/* ---------- Database ---------- */
.filters { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 14px; align-items: end; }
.filters .field { margin: 0; }
.filters-2 { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: end; margin-top: 14px; }
.filters-2 .yr { width: 7em; }
@media (max-width: 860px) { .filters { grid-template-columns: 1fr 1fr; } .filters .q { grid-column: 1 / -1; } }
@media (max-width: 480px) { .filters { grid-template-columns: 1fr; } }

.result-bar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin: 24px 0 12px; }
.result-bar .actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.result-bar select { width: auto; padding: 7px 10px; }
#map { height: 380px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 16px; z-index: 1; }

.records { list-style: none; margin: 0; padding: 0; }
.records details { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); margin-bottom: 8px; }
.records details[open] { border-color: var(--dusk); }
.records summary { list-style: none; cursor: pointer; padding: 14px 18px; display: grid; grid-template-columns: 4.2em 1fr; gap: 14px; }
.records summary::-webkit-details-marker { display: none; }
.records summary:hover .t { color: var(--eye-deep); }
.records .y { font: 700 1.15rem var(--display); color: var(--bark); font-variant-numeric: tabular-nums; }
.records .t { font-weight: 700; display: block; line-height: 1.35; }
.records .a { display: block; color: var(--muted); font-size: .93rem; margin: 3px 0 7px; }
.records .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.records dl { margin: 0; padding: 4px 18px 18px calc(4.2em + 32px); display: grid; grid-template-columns: 9em 1fr; gap: 6px 14px; font-size: .96rem; }
.records dt { color: var(--muted); }
.records dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 560px) {
  .records summary { grid-template-columns: 1fr; gap: 2px; }
  .records dl { padding-left: 18px; grid-template-columns: 1fr; gap: 0; }
  .records dd { margin-bottom: 8px; }
}
.pager { display: flex; gap: 12px; justify-content: center; align-items: center; margin-top: 20px; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); background: var(--paper); border: 1px dashed #9aa1b8; border-radius: 10px; }
.empty h3 { color: var(--ink); }
.empty p { margin-left: auto; margin-right: auto; }

/* ---------- Awareness ---------- */
.materials { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
.materials li { background: var(--paper); border: 1px solid var(--line); border-top: 5px solid var(--bark); border-radius: var(--r); padding: 20px; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.materials p { flex: 1; margin: 0; color: var(--muted); }

/* ---------- Admin ---------- */
.tabs { display: flex; gap: 4px; flex-wrap: wrap; border-bottom: 2px solid var(--line); margin-bottom: 24px; }
.tabs button { font: 700 1rem var(--body); background: none; border: 0; padding: 12px 16px; cursor: pointer; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; }
.tabs button[aria-selected=true] { color: var(--ink); border-bottom-color: var(--eye); }
.cards { list-style: none; margin: 0; padding: 0; }
.cards > li { background: var(--paper); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; margin-bottom: 10px; }
.cards .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.cards .who { font-weight: 700; }
.cards p { margin: 8px 0; overflow-wrap: anywhere; }
.cards .acts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.cards img { max-height: 220px; border-radius: var(--r); margin: 10px 0; }

/* ---------- Footer ---------- */
.site-footer { background: var(--night); color: #b9c0dc; padding: 40px 0; margin-top: 0; font-size: .95rem; }
.site-footer strong { color: #fff; font-family: var(--display); font-size: 1.05rem; }
.site-footer a { color: var(--eye); }
.foot { display: grid; grid-template-columns: 1.1fr 1.3fr 1fr; gap: 32px; }
.foot p { margin: 6px 0 0; }
@media (max-width: 760px) { .foot { grid-template-columns: 1fr; gap: 16px; } }

/* ---------- Search hints ---------- */
.suggest { position: relative; flex: 1; min-width: 0; }
.hints {
  position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20;
  list-style: none; margin: 0; padding: 4px; max-height: 340px; overflow-y: auto;
  background: var(--paper); color: var(--ink); text-align: left;
  border: 1.5px solid var(--night); border-radius: var(--r); box-shadow: 0 12px 28px rgba(20, 26, 46, .28);
}
.hints li { display: flex; justify-content: space-between; align-items: baseline; gap: 14px; padding: 9px 12px; border-radius: 4px; cursor: pointer; }
.hints li:hover, .hints li[aria-selected=true] { background: var(--moon); }
.hints li[aria-selected=true] { box-shadow: inset 4px 0 0 var(--eye); }
.hints .h-label { overflow-wrap: anywhere; line-height: 1.35; }
.hints .h-kind { flex: none; font-size: .82rem; color: var(--muted); white-space: nowrap; }
.hints mark { background: #ffe2a8; color: inherit; border-radius: 2px; padding: 0 1px; }
@media (max-width: 480px) { .hints li { flex-direction: column; gap: 0; } }

</style>
</head>
<body>
<template id="page-index"><main id="main">

  <section class="hero">
    <div class="wrap hero-grid">
      <div class="hero-copy">
        <h1>What is known about India's nightjars, gathered in one place</h1>
        <p class="lede">Papers, notes, theses and books on the family Caprimulgidae from Gujarat and across the Indian subcontinent, indexed so you can search them by subject, place and year.</p>
        <form class="hero-search" action="#database" method="get" role="search">
          <label class="hp" for="hq">Search the records</label>
          <input id="hq" name="q" type="search" placeholder="Try: breeding, road kill, Gujarat, Savanna Nightjar">
          <button class="btn amber" type="submit">Search the data</button>
        </form>
        <p class="hero-facts" id="facts">&nbsp;</p>
      </div>

      <!-- A torch beam finding a nightjar's eyeshine on a dark track: how these birds are surveyed. -->
      <svg class="scene" viewBox="0 0 440 320" role="img" aria-label="A torch beam crossing dark ground and catching the amber eyeshine of a nightjar">
        <defs>
          <linearGradient id="beam" x1="0" x2="1">
            <stop offset="0" stop-color="#fff6dc" stop-opacity=".55"/>
            <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
          </linearGradient>
          <radialGradient id="halo">
            <stop offset="0" stop-color="#f2a93b" stop-opacity=".75"/>
            <stop offset="1" stop-color="#f2a93b" stop-opacity="0"/>
          </radialGradient>
        </defs>
        <g fill="#fff">
          <circle cx="60" cy="40" r="1.3" opacity=".8"/><circle cx="150" cy="22" r="1" opacity=".6"/>
          <circle cx="232" cy="58" r="1.4" opacity=".7"/><circle cx="300" cy="28" r="1" opacity=".5"/>
          <circle cx="384" cy="70" r="1.2" opacity=".8"/><circle cx="110" cy="96" r="1" opacity=".5"/>
          <circle cx="410" cy="20" r="1" opacity=".6"/><circle cx="26" cy="120" r="1.1" opacity=".5"/>
        </g>
        <path d="M352 44a26 26 0 1 0 18 44 21 21 0 1 1-18-44z" fill="#e6e9f5" opacity=".9"/>
        <path d="M0 232c70-18 130-10 200-16s160-22 240-8v112H0z" fill="#0d1122"/>
        <path d="M0 262c90-14 190-6 280-14s110-4 160-2v74H0z" fill="#080b17"/>
        <polygon class="beam" points="40,250 400,196 400,262" fill="url(#beam)"/>
        <!-- the bird: a low, flat shape on the ground -->
        <path d="M286 236c10-13 34-17 52-10 8 3 13 7 20 6-5 6-14 8-24 8h-52c-4 0-2-2 4-4z" fill="#05070f"/>
        <circle class="halo" cx="339" cy="229" r="24" fill="url(#halo)"/>
        <circle class="shine" cx="339" cy="229" r="4.2" fill="#f2a93b"/>
        <circle class="shine" cx="340.3" cy="227.8" r="1.3" fill="#fff6dc"/>
      </svg>
    </div>
  </section>

  <section class="section on-paper">
    <div class="wrap split">
      <div>
        <h2>Why this portal exists</h2>
        <p>Nightjars are active at dusk and through the night, they sit still on bare ground, and their plumage makes them look like leaf litter. That is why so little is written about them, and why what is written is scattered across journals, checklists and old natural history notes.</p>
        <p>We have read through that literature and indexed every record we could find for the Indian subcontinent, with Gujarat as our starting point. Each entry tells you what was studied, where, when and by whom, so you can go straight to the source.</p>
        <p><a class="btn" href="#account">Request access to the data</a></p>
      </div>
      <div>
        <h3>What the records cover</h3>
        <ul class="bars" id="bars" aria-label="Number of records by subject"></ul>
        <p class="small muted" id="bars-note"></p>
      </div>
    </div>
  </section>

  <section class="section grant" id="grant">
    <div class="wrap split">
      <div>
        <h2>Supported by the Global Nightjar Network and Kshitij Foundation</h2>
        <p>This work received the <span id="g-name"></span>, a collaborative initiative of the <span id="g-funders"></span>. The award was announced on <span id="g-date"></span>.</p>
        <p>The microgrant supports data processing, field validation in Gujarat and outreach, so that records of these birds become a shared, research-ready resource for India.</p>
        <p><a id="g-link" href="#" rel="noopener">Read the announcement on globalnightjar.org</a></p>
      </div>
      <blockquote>
        <span id="g-project"></span>
        <footer>The funded project this portal is part of</footer>
      </blockquote>
    </div>
  </section>

  <section class="section">
    <div class="wrap">

<script>// One data layer with two engines:
//   live  - Supabase (accounts, approval, records, uploads). Access rules are enforced by the database.
//   demo  - localStorage in this browser, so the site can be tried before Supabase is connected.
(function () {
  const cfg = window.PORTAL;
  const live = !!(cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY && window.supabase);
  const sb = live ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

  const ok = (res) => { if (res.error) throw new Error(res.error.message); return res.data; };
  const fileExt = (f) => (f.name.split(".").pop() || "bin").toLowerCase().replace(/[^a-z0-9]/g, "");
  const randomName = (f) => Date.now() + "-" + Math.random().toString(36).slice(2, 10) + "." + fileExt(f);

  // ---------------- Live engine ----------------
  const Live = {
    mode: "live",
    async getUser() {
      const { data } = await sb.auth.getSession();
      const u = data.session && data.session.user;
      if (!u) return null;
      const p = await sb.from("profiles").select("full_name, role").eq("id", u.id).maybeSingle();
      return { id: u.id, email: u.email, full_name: (p.data && p.data.full_name) || "", role: (p.data && p.data.role) || "user" };
    },
    async signUp({ email, password, full_name, affiliation, purpose }) {
      const data = ok(await sb.auth.signUp({
        email, password,
        options: { data: { full_name, affiliation, purpose }, emailRedirectTo: location.href.split("#")[0] }
      }));
      return { needsEmailConfirm: !data.session };
    },
    async signIn(email, password) { ok(await sb.auth.signInWithPassword({ email, password })); },
    async signOut() { await sb.auth.signOut(); },
    async resetPassword(email) {
      ok(await sb.auth.resetPasswordForEmail(email, { redirectTo: location.href.split("#")[0] }));
    },
    async myRequest() {
      const u = await this.getUser(); if (!u) return null;
      const rows = ok(await sb.from("access_requests").select("*").eq("user_id", u.id).order("created_at", { ascending: false }).limit(1));
      return rows[0] || null;
    },
    async requestAgain({ affiliation, purpose }) {
      const u = await this.getUser();
      ok(await sb.from("access_requests").insert({ user_id: u.id, full_name: u.full_name, email: u.email, affiliation, purpose }));
    },
    async getStats() { return ok(await sb.rpc("portal_stats")); },
    async getRecords() { return ok(await sb.from("records").select("*").order("year", { ascending: false, nullsFirst: false })); },
    async submitObservation(row, file) {
      if (file) {
        const path = randomName(file);
        ok(await sb.storage.from("submissions").upload(path, file, { contentType: file.type }));
        row.photo_path = path;
      }
      ok(await sb.from("submissions").insert(row));
    },
    async listMaterials() { return ok(await sb.from("materials").select("*").order("created_at", { ascending: false })); },

    // Admin
    async listRequests() { return ok(await sb.from("access_requests").select("*").order("created_at", { ascending: false })); },
    async setRequestStatus(id, status, admin_note) {
      ok(await sb.from("access_requests").update({ status, admin_note: admin_note || null, reviewed_at: new Date().toISOString() }).eq("id", id));
    },
    async listSubmissions() { return ok(await sb.from("submissions").select("*").order("created_at", { ascending: false })); },
    async setSubmissionStatus(id, status) { ok(await sb.from("submissions").update({ status }).eq("id", id)); },
    async photoUrl(path) {
      const d = ok(await sb.storage.from("submissions").createSignedUrl(path, 3600));
      return d.signedUrl;
    },
    async addMaterial({ title, description, kind, language, file, url }) {
      let file_url = url;
      if (file) {
        const path = randomName(file);
        ok(await sb.storage.from("materials").upload(path, file, { contentType: file.type }));
        file_url = sb.storage.from("materials").getPublicUrl(path).data.publicUrl;
      }
      ok(await sb.from("materials").insert({ title, description, kind, language, file_url }));
    },
    async deleteMaterial(id) { ok(await sb.from("materials").delete().eq("id", id)); }
  };

  // ---------------- Demo engine ----------------
  const K = "nightjar-demo-";
  const load = (k, d) => { try { return JSON.parse(STORE.get(K + k)) || d; } catch (e) { return d; } };
  const save = (k, v) => { try { STORE.set(K + k, JSON.stringify(v)); } catch (e) { /* storage full or blocked */ } };
  const ADMIN = { id: "admin", email: "admin@demo.local", password: "nightjar", full_name: "Demo admin", role: "admin" };
  const users = () => [ADMIN].concat(load("users", []));
  const nextId = (rows) => rows.reduce((m, r) => Math.max(m, r.id), 0) + 1;
  const asDataUrl = (file) => new Promise((res, rej) => {
    const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file);
  });

  const Demo = {
    mode: "demo",
    demoAdmin: { email: ADMIN.email, password: ADMIN.password },
    async getUser() {
      const id = load("session", null);
      const u = users().find((x) => x.id === id);
      return u ? { id: u.id, email: u.email, full_name: u.full_name, role: u.role } : null;
    },
    async signUp({ email, password, full_name, affiliation, purpose }) {
      email = email.trim().toLowerCase();
      if (users().some((u) => u.email === email)) throw new Error("An account with this email already exists. Sign in instead.");
      const list = load("users", []);
      const u = { id: "u" + Date.now(), email, password, full_name, role: "user" };
      list.push(u); save("users", list); save("session", u.id);
      const reqs = load("requests", []);
      reqs.push({ id: nextId(reqs), user_id: u.id, full_name, email, affiliation, purpose, status: "pending", created_at: new Date().toISOString() });
      save("requests", reqs);
      return { needsEmailConfirm: false };
    },
    async signIn(email, password) {
      const u = users().find((x) => x.email === email.trim().toLowerCase() && x.password === password);
      if (!u) throw new Error("Email or password is not right.");
      save("session", u.id);
    },
    async signOut() { save("session", null); },
    async resetPassword() { throw new Error("Password reset works once the portal is connected to Supabase."); },
    async myRequest() {
      const u = await this.getUser(); if (!u) return null;
      return load("requests", []).filter((r) => r.user_id === u.id).sort((a, b) => b.id - a.id)[0] || null;
    },
    async requestAgain({ affiliation, purpose }) {
      const u = await this.getUser(); const reqs = load("requests", []);
      reqs.push({ id: nextId(reqs), user_id: u.id, full_name: u.full_name, email: u.email, affiliation, purpose, status: "pending", created_at: new Date().toISOString() });
      save("requests", reqs);
    },
    async getStats() { return window.DEMO_STATS; },
    async getRecords() {
      const u = await this.getUser(); const r = await this.myRequest();
      if (!u || !(u.role === "admin" || (r && r.status === "approved"))) return [];
      return window.DEMO_RECORDS.slice();
    },
    async submitObservation(row, file) {
      const subs = load("submissions", []);
      if (file && file.size < 400000) row.photo_path = await asDataUrl(file);
      else if (file) row.photo_path = null, row.notes = (row.notes || "") + " [Photo " + file.name + " not kept in demo mode]";
      subs.push(Object.assign({ id: nextId(subs), status: "new", created_at: new Date().toISOString() }, row));
      save("submissions", subs);
    },
    async listMaterials() { return load("materials", []).slice().reverse(); },
    async listRequests() { return load("requests", []).slice().reverse(); },
    async setRequestStatus(id, status, admin_note) {
      const reqs = load("requests", []); const r = reqs.find((x) => x.id === id);
      if (r) { r.status = status; r.admin_note = admin_note || null; r.reviewed_at = new Date().toISOString(); }
      save("requests", reqs);
    },
    async listSubmissions() { return load("submissions", []).slice().reverse(); },
    async setSubmissionStatus(id, status) {
      const subs = load("submissions", []); const s = subs.find((x) => x.id === id);
      if (s) s.status = status; save("submissions", subs);
    },
    async photoUrl(path) { return path; },
    async addMaterial({ title, description, kind, language, file, url }) {
      const list = load("materials", []);
      let file_url = url;
      if (file) {
        if (file.size > 400000) throw new Error("Demo mode keeps files under 400 KB. Paste a link instead, or connect Supabase.");
        file_url = await asDataUrl(file);
      }
      list.push({ id: nextId(list), title, description, kind, language, file_url, created_at: new Date().toISOString() });
      save("materials", list);
    },
    async deleteMaterial(id) { save("materials", load("materials", []).filter((m) => m.id !== id)); }
  };

  window.DB = live ? Live : Demo;
})();
</script>

<script>// Search hints: a dropdown under a search box that narrows as the person types.
// attachSuggest(input, source, onPick)
//   source(query) -> array of { label, kind, note?, href? }   (already filtered and ordered)
//   onPick(item)  -> what to do when a hint is chosen
(function () {
  const reEsc = (s) => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const wordsOf = (q) => q.toLowerCase().split(/\s+/).filter(Boolean);

  // Keep the items that contain every typed word; best matches first.
  window.rankHints = function (query, items, limit) {
    const words = wordsOf(query);
    if (!words.length) return [];
    const q = words.join(" ");
    const out = [];
    for (const it of items) {
      const l = it.label.toLowerCase();
      if (!words.every((w) => l.includes(w))) continue;
      const score = l.startsWith(q) ? 0 : words.every((w) => new RegExp("(^|[^a-z0-9])" + reEsc(w)).test(l)) ? 1 : 2;
      out.push({ it, score });
    }
    out.sort((a, b) => a.score - b.score || (a.it.rank || 0) - (b.it.rank || 0) || a.it.label.length - b.it.label.length);
    return out.slice(0, limit || 8).map((x) => x.it);
  };

  // Escape the label and wrap the typed words in <mark>.
  function highlight(label, query) {
    const words = wordsOf(query).map(reEsc);
    if (!words.length) return esc(label);
    return label.split(new RegExp("(" + words.join("|") + ")", "ig"))
      .map((part, i) => (i % 2 ? "<mark>" + esc(part) + "</mark>" : esc(part))).join("");
  }

  let uid = 0;
  window.attachSuggest = function (input, source, onPick) {
    const id = "hints-" + (++uid);
    const wrap = document.createElement("div");
    wrap.className = "suggest";
    input.parentNode.insertBefore(wrap, input);
    wrap.appendChild(input);
    const list = document.createElement("ul");
    list.id = id; list.className = "hints hidden"; list.setAttribute("role", "listbox");
    list.setAttribute("aria-label", "Search hints");
    wrap.appendChild(list);
    input.setAttribute("role", "combobox");
    input.setAttribute("aria-autocomplete", "list");
    input.setAttribute("aria-controls", id);
    input.setAttribute("aria-expanded", "false");
    input.setAttribute("autocomplete", "off");

    let items = [], active = -1, silent = false;

    const close = () => { list.classList.add("hidden"); input.setAttribute("aria-expanded", "false"); input.removeAttribute("aria-activedescendant"); active = -1; };
    const mark = () => {
      list.querySelectorAll("li").forEach((li, i) => li.setAttribute("aria-selected", i === active));
      if (active >= 0) { input.setAttribute("aria-activedescendant", id + "-" + active); list.children[active].scrollIntoView({ block: "nearest" }); }
      else input.removeAttribute("aria-activedescendant");
    };
    const open = () => {
      const q = input.value.trim();
      items = q ? source(q) : [];
      if (!items.length) { close(); return; }
      list.innerHTML = items.map((it, i) =>
        '<li role="option" id="' + id + "-" + i + '" data-i="' + i + '" aria-selected="false">' +
        '<span class="h-label">' + highlight(it.label, q) + "</span>" +
        '<span class="h-kind">' + esc(it.kind) + (it.note ? ", " + esc(it.note) : "") + "</span></li>").join("");
      active = -1;
      list.classList.remove("hidden"); input.setAttribute("aria-expanded", "true");
    };
    const pick = (i) => {
      const it = items[i]; if (!it) return;
      close();
      silent = true; onPick(it); silent = false;
    };

    input.addEventListener("input", () => { if (!silent) open(); });
    input.addEventListener("focus", () => { if (input.value.trim()) open(); });
    input.addEventListener("blur", () => setTimeout(close, 120));
    input.addEventListener("keydown", (e) => {
      const isOpen = !list.classList.contains("hidden");
      if (e.key === "ArrowDown" || e.key === "ArrowUp") {
        if (!isOpen) { open(); return; }
        e.preventDefault();
        const n = items.length;
        active = e.key === "ArrowDown" ? (active + 1) % n : (active <= 0 ? n - 1 : active - 1);
        mark();
      } else if (e.key === "Enter" && isOpen && active >= 0) { e.preventDefault(); pick(active); }
      else if (e.key === "Escape" && isOpen) { e.preventDefault(); close(); }
    });
    // mousedown (not click) so the choice lands before the input loses focus
    list.addEventListener("mousedown", (e) => {
      const li = e.target.closest("li"); if (!li) return;
      e.preventDefault(); pick(Number(li.dataset.i));
    });
  };
})();

<script>
const APP = function () {// Shared page furniture: header, footer, demo notice, small helpers.
(function () {
  const cfg = window.PORTAL;

  window.esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  window.$ = (sel, root) => (root || document).querySelector(sel);
  window.fmtDate = (iso) => iso ? new Date(iso).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }) : "";
  // Only allow web links and inline demo files to be used as a link target.
  window.safeUrl = (u) => /^(https?:|data:(image|application\/pdf))/i.test(u || "") ? u : "#";

  window.toast = (msg, bad) => {
    let t = $("#toast");
    if (!t) { t = document.createElement("div"); t.id = "toast"; t.setAttribute("role", "status"); document.body.appendChild(t); }
    t.textContent = msg; t.className = bad ? "show bad" : "show";
    clearTimeout(t._h); t._h = setTimeout(() => (t.className = ""), 4500);
  };

  // Wraps a form submit: disables the button while working, shows errors as a toast.
  window.onSubmit = (form, handler) => form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = form.querySelector("button[type=submit]");
    const label = btn && btn.textContent;
    if (btn) { btn.disabled = true; btn.textContent = "Working…"; }
    try { await handler(Object.fromEntries(new FormData(form).entries()), form); }
    catch (err) { toast(err.message || "Something went wrong. Try again.", true); }
    finally { if (btn) { btn.disabled = false; btn.textContent = label; } }
  });

  const links = [
    ["#index", "Home"],
    ["#database", "Search the data"],
    ["#submit", "Send an observation"],
    ["#awareness", "Awareness material"]
  ];
  const here = "#" + window.PAGE;

  async function chrome() {
    const header = document.createElement("header");
    header.className = "site-header";
    header.innerHTML =
      '<a class="skip" href="#main">Skip to content</a>' +
      '<div class="wrap bar">' +
        '<a class="brand" href="#index"><span class="eye" aria-hidden="true"></span>' + esc(cfg.SITE_NAME) + "</a>" +
        '<button class="menu-btn" aria-expanded="false" aria-controls="nav">Menu</button>' +
        '<nav id="nav" aria-label="Main">' +
          links.map(([h, t]) => '<a href="' + h + '"' + (h === here ? ' aria-current="page"' : "") + ">" + t + "</a>").join("") +
          '<span id="nav-user"></span>' +
        "</nav>" +
      "</div>";
    document.body.prepend(header);
    const btn = $(".menu-btn", header), nav = $("#nav", header);
    btn.addEventListener("click", () => {
      const open = nav.classList.toggle("open"); btn.setAttribute("aria-expanded", open);
    });

    if (DB.mode === "demo") {
      const n = document.createElement("div");
      n.className = "demo-note";
      n.innerHTML = '<div class="wrap">Local mode: all 209 records are stored inside this file. Requests and observations are saved only in this browser. ' +
        "Admin sign-in for testing is <b>" + DB.demoAdmin.email + "</b> with password <b>" + DB.demoAdmin.password + "</b>.</div>";
      header.after(n);
    }

    const footer = document.createElement("footer");
    footer.className = "site-footer";
    footer.innerHTML =
      '<div class="wrap foot">' +
        "<div><strong>" + esc(cfg.SITE_NAME) + "</strong><p>An open reference on the nightjars (Caprimulgidae) of Gujarat and the Indian subcontinent.</p></div>" +
        "<div><p>Supported by the " + esc(cfg.GRANT.name) + ", a collaborative initiative of " + esc(cfg.GRANT.funders) + ".</p></div>" +
        '<div><p>Questions or corrections: <a href="mailto:' + esc(cfg.CONTACT_EMAIL) + '">' + esc(cfg.CONTACT_EMAIL) + "</a></p>" +
        '<p><a href="#account">Account</a></p></div>' +
      "</div>";
    document.body.appendChild(footer);

    let user = null;
    try { user = await DB.getUser(); } catch (e) { /* offline or not configured */ }
    $("#nav-user").innerHTML =
      (user && user.role === "admin" ? '<a href="#admin"' + (here === "#admin" ? ' aria-current="page"' : "") + ">Admin</a>" : "") +
      '<a class="nav-cta" href="#account">' + (user ? esc(user.full_name || user.email) : "Sign in") + "</a>";
    return user;
  }

  // Pages await this to get the signed-in user (or null) once the header is ready.
  window.ready = new Promise((resolve) => {
    const go = () => chrome().then(resolve);
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", go); else go();
  });
})();
};
const PAGES = {
  index: function () {(async function () {
  const g = PORTAL.GRANT;
  $("#g-name").textContent = g.name;
  $("#g-funders").textContent = g.funders;
  $("#g-date").textContent = g.announced;
  $("#g-project").textContent = g.project;
  $("#g-link").href = g.link;

  $("#species").innerHTML = SPECIES.map(([n, s, d]) =>
    "<li><b>" + esc(n) + "</b><i>" + esc(s) + "</i><span>" + esc(d) + "</span></li>").join("");

  await ready;
  // Search hints. Built only from public content: species, subject names, and pages of this site.
  const hints = SPECIES.map(([n, s]) => ({ label: n, kind: "Species", note: s, rank: 1 }))
    .concat(SPECIES.map(([n, s]) => ({ label: s, kind: "Species", note: n, rank: 2 })))
    .concat([
      { label: "Search the data", kind: "Page", href: "#database", rank: 3 },
      { label: "Request access to the data", kind: "Page", href: "#account", rank: 3 },
      { label: "Send an observation, sighting or photo", kind: "Page", href: "#submit", rank: 3 },
      { label: "Awareness material: posters, leaflets and guides", kind: "Page", href: "#awareness", rank: 3 },
      { label: "Microgrant from Global Nightjar Network and Kshitij Foundation", kind: "On this page", anchor: "grant", rank: 3 },
      { label: "Nightjar species of the Indian subcontinent", kind: "On this page", anchor: "species-list", rank: 3 }
    ]);
  attachSuggest($("#hq"), (q) => rankHints(q, hints, 8), (it) => {
    if (it.anchor) { $("#hq").value = ""; document.getElementById(it.anchor).scrollIntoView(); }
    else location.href = it.href || "#database?q=" + encodeURIComponent(it.label);
  });
  try {
    const s = await DB.getStats();
    if (!s || !s.total) throw new Error("no stats");
    $("#facts").innerHTML = "<b>" + s.total + "</b> records from <b>" + s.countries + "</b> countries, published between <b>" +
      s.year_min + "</b> and <b>" + s.year_max + "</b>";
    Object.entries(s.by_subject).forEach(([k, n]) => { if (k !== "Unclassified") hints.push({ label: k, kind: "Subject", note: n + (n === 1 ? " record" : " records"), rank: 0 }); });
    hints.push({ label: "Gujarat", kind: "Region", note: s.gujarat + " records", rank: 0 });
    const rows = Object.entries(s.by_subject).sort((a, b) => b[1] - a[1]);
    const max = rows[0][1];
    // Square-root scale so small subjects stay visible next to the largest one.
    $("#bars").innerHTML = rows.map(([k, n]) =>
      "<li><span>" + esc(k) + '</span><span class="track"><span class="fill" style="width:' +
      (Math.sqrt(n / max) * 100).toFixed(1) + '%"></span></span><span class="n">' + n + "</span></li>").join("");
    $("#bars-note").textContent = s.gujarat + " records are from Gujarat and " + s.mapped +
      " have map coordinates. Bar lengths are scaled so that small subjects stay visible.";
  } catch (e) {
    $("#facts").textContent = "Published records from across the Indian subcontinent";
    $("#bars").innerHTML = "<li>Record counts appear here once the data is loaded.</li>";
  }
})();
},
  database: function () {(async function () {
  const user = await ready;
  const gate = $("#gate");
  const PER_PAGE = 25;
  let all = [], shown = [], page = 1, map = null, layer = null;

  // ---------- Who may see the data ----------
  if (!user) {
    let line = "";
    try { const s = await DB.getStats(); if (s && s.total) line = "<p>The index holds <b>" + s.total + "</b> records from <b>" + s.countries + "</b> countries, published between " + s.year_min + " and " + s.year_max + ".</p>"; } catch (e) {}
    gate.innerHTML = "<h2>Access is by request</h2>" + line +
      "<p>The records are free to use for research, conservation and education. Send a short request and we will review it.</p>" +
      '<p><a class="btn" href="#account">Request access</a> <a class="btn ghost" href="#account?signin">Sign in</a></p>';
    return;
  }
  let req = null;
  try { req = await DB.myRequest(); } catch (e) {}
  const allowed = user.role === "admin" || (req && req.status === "approved");
  if (!allowed) {
    const rejected = req && req.status === "rejected";
    gate.innerHTML = !req
      ? '<h2>You have not requested access yet</h2><p>Send a short request and we will review it.</p><p><a class="btn" href="#account">Request access</a></p>'
      : rejected
      ? "<h2>Your request was not approved</h2><p>" + (req.admin_note ? "Note from the team: " + esc(req.admin_note) : "You can send a new request with more detail about your work.") + '</p><p><a class="btn" href="#account">Send a new request</a></p>'
      : "<h2>Your request is waiting for review</h2><p>We received it on " + fmtDate(req && req.created_at) + ". A person on our team reads every request, so this can take a few days. You will be able to search as soon as it is approved.</p>";
    return;
  }

  try { all = await DB.getRecords(); }
  catch (e) { gate.innerHTML = '<div class="notice bad"><p>The records could not be loaded: ' + esc(e.message) + ". Reload the page to try again.</p></div>"; return; }
  gate.classList.add("hidden");
  $("#app").classList.remove("hidden");

  // ---------- Filters ----------
  const fill = (sel, key) => {
    const counts = {};
    all.forEach((r) => { if (r[key]) counts[r[key]] = (counts[r[key]] || 0) + 1; });
    Object.keys(counts).sort((a, b) => counts[b] - counts[a] || a.localeCompare(b)).forEach((v) => {
      const o = document.createElement("option"); o.value = v; o.textContent = v + " (" + counts[v] + ")"; sel.appendChild(o);
    });
  };
  fill($("#f-subject"), "subject"); fill($("#f-type"), "type"); fill($("#f-country"), "country");

  const q0 = new URLSearchParams(location.hash.split("?")[1] || "").get("q");
  if (q0) $("#q").value = q0;

  all.forEach((r) => { r._text = [r.title, r.authors, r.journal, r.place, r.institute, r.country, r.subject, r.type, r.year].join(" ").toLowerCase(); });

  // ---------- Search hints ----------
  // Every distinct subject, country, place, author, journal and title becomes a possible hint.
  const hints = [], seen = new Set();
  const addHint = (label, kind, rank) => {
    label = (label || "").trim();
    const key = kind + "|" + label.toLowerCase();
    if (label.length < 2 || seen.has(key)) return;
    seen.add(key); hints.push({ label, kind, rank });
  };
  SPECIES.forEach(([n, s]) => { addHint(n, "Species", 0); addHint(s, "Species", 0); });
  all.forEach((r) => {
    addHint(r.subject, "Subject", 0); addHint(r.country, "Country", 1); addHint(r.place, "Place", 2);
    (r.authors || "").split(";").forEach((a) => addHint(a, "Author", 3));
    addHint(r.journal, "Journal", 4); addHint(r.title, "Title", 5);
  });
  if (all.some((r) => r.is_gujarat)) addHint("Gujarat", "Region", 0);
  const hitCount = (label) => {
    const w = label.toLowerCase().split(/\s+/).filter(Boolean);
    return all.filter((r) => w.every((x) => r._text.includes(x))).length;
  };
  attachSuggest($("#q"), (q) =>
    // Look at more candidates than we show, then keep only hints that really lead to records.
    rankHints(q, hints, 30).map((h) => { const n = hitCount(h.label); return n ? Object.assign({}, h, { note: n + (n === 1 ? " record" : " records") }) : null; })
      .filter(Boolean).slice(0, 8),
    (it) => { $("#q").value = it.label; apply(); });

  function apply() {
    const words = $("#q").value.toLowerCase().split(/\s+/).filter(Boolean);
    const sub = $("#f-subject").value, typ = $("#f-type").value, ctry = $("#f-country").value;
    const y1 = parseInt($("#y1").value, 10), y2 = parseInt($("#y2").value, 10);
    const guj = $("#f-guj").checked, mapped = $("#f-map").checked;
    shown = all.filter((r) =>
      words.every((w) => r._text.includes(w)) &&
      (!sub || r.subject === sub) && (!typ || r.type === typ) && (!ctry || r.country === ctry) &&
      (isNaN(y1) || (r.year && r.year >= y1)) && (isNaN(y2) || (r.year && r.year <= y2)) &&
      (!guj || r.is_gujarat) && (!mapped || r.latitude != null));
    const s = $("#sort").value;
    shown.sort(s === "title" ? (a, b) => a.title.localeCompare(b.title)
      : s === "old" ? (a, b) => (a.year || 9999) - (b.year || 9999)
      : (a, b) => (b.year || 0) - (a.year || 0));
    page = 1; render(); drawMap();
  }

  // ---------- Results ----------
  const row = (k, v) => v ? "<dt>" + k + "</dt><dd>" + v + "</dd>" : "";
  function render() {
    $("#count").textContent = shown.length === all.length ? all.length + " records"
      : shown.length + " of " + all.length + " records";
    const list = $("#list");
    if (!shown.length) {
      list.innerHTML = '<li class="empty"><h3>No records match these filters</h3><p>Try fewer words, widen the years, or clear the filters.</p></li>';
      $("#pager").innerHTML = ""; return;
    }
    const slice = shown.slice((page - 1) * PER_PAGE, page * PER_PAGE);
    list.innerHTML = slice.map((r) =>
      "<li><details><summary>" +
        '<span class="y">' + (r.year || "n.d.") + "</span>" +
        '<span><span class="t">' + esc(r.title) + "</span>" +
        '<span class="a">' + esc(r.authors || "Author not recorded") + "</span>" +
        '<span class="tags"><span class="tag">' + esc(r.subject) + '</span><span class="tag">' + esc(r.type) + "</span>" +
        (r.is_gujarat ? '<span class="tag guj">Gujarat</span>' : "") + "</span></span>" +
      "</summary><dl>" +
        row("Published in", esc(r.journal)) + row("Volume and pages", esc(r.volume_pages)) +
        row("Publication date", fmtDate(r.pub_date)) + row("Institute", esc(r.institute)) +
        row("Country", esc(r.country)) + row("Study location", esc(r.place)) +
        row("Coordinates", r.latitude != null ? r.latitude + ", " + r.longitude : "") +
        row("Record number", r.id) +
      "</dl></details></li>").join("");
    const pages = Math.ceil(shown.length / PER_PAGE);
    $("#pager").innerHTML = pages < 2 ? "" :
      '<button class="btn ghost sm" id="prev"' + (page === 1 ? " disabled" : "") + ">Previous</button>" +
      "<span>Page " + page + " of " + pages + "</span>" +
      '<button class="btn ghost sm" id="next"' + (page === pages ? " disabled" : "") + ">Next</button>";
    const step = (d) => () => { page += d; render(); $("#count").scrollIntoView({ block: "start" }); };
    if ($("#prev")) { $("#prev").onclick = step(-1); $("#next").onclick = step(1); }
  }

  // ---------- Map ----------
  function drawMap() {
    if (!map) return;
    layer.clearLayers();
    const pts = shown.filter((r) => r.latitude != null);
    pts.forEach((r) => L.circleMarker([r.latitude, r.longitude], { radius: 7, color: "#141a2e", weight: 2, fillColor: "#f2a93b", fillOpacity: .9 })
      .bindPopup("<b>" + esc(r.title) + "</b><br>" + esc(r.place || "") + (r.year ? " (" + r.year + ")" : "")).addTo(layer));
    if (pts.length) map.fitBounds(L.latLngBounds(pts.map((r) => [r.latitude, r.longitude])).pad(.2), { maxZoom: 9 });
  }
  $("#toggle-map").addEventListener("click", (e) => {
    if (!window.L) { toast("The map could not be loaded. Check your connection and reload.", true); return; }
    const hidden = $("#map").classList.toggle("hidden");
    e.target.textContent = hidden ? "Show map" : "Hide map";
    e.target.setAttribute("aria-expanded", !hidden);
    if (hidden) return;
    if (!map) {
      map = L.map("map").setView([22.3, 78.5], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
      layer = L.layerGroup().addTo(map);
    }
    map.invalidateSize(); drawMap();
  });

  // ---------- Export ----------
  $("#export").addEventListener("click", () => {
    if (!shown.length) { toast("There are no results to download.", true); return; }
    const cols = ["id", "type", "title", "authors", "year", "pub_date", "journal", "volume_pages", "subject", "institute", "country", "place", "latitude", "longitude"];
    const cell = (v) => { v = v == null ? "" : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    const csv = [cols.join(",")].concat(shown.map((r) => cols.map((c) => cell(r[c])).join(","))).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = "nightjar-records.csv"; a.click(); URL.revokeObjectURL(a.href);
    toast("Downloaded " + shown.length + " records");
  });

  let t;
  $("#filters").addEventListener("input", () => { clearTimeout(t); t = setTimeout(apply, 150); });
  $("#sort").addEventListener("change", apply);
  $("#clear").addEventListener("click", () => { $("#filters").reset(); apply(); });
  apply();
})();
},
  account: function () {(async function () {
  const user = await ready;
  const status = $("#status");

  // ---------- Signed out: request access or sign in ----------
  if (!user) {
    $("#auth").classList.remove("hidden");
    const show = (which) => {
      const up = which === "up";
      $("#p-up").classList.toggle("hidden", !up); $("#p-in").classList.toggle("hidden", up);
      $("#tab-up").setAttribute("aria-selected", up); $("#tab-in").setAttribute("aria-selected", !up);
    };
    $("#tab-up").onclick = () => show("up");
    $("#tab-in").onclick = () => show("in");
    if (location.hash.endsWith("?signin")) show("in");

    onSubmit($("#p-up"), async (d) => {
      const r = await DB.signUp(d);
      if (r.needsEmailConfirm) {
        $("#auth").classList.add("hidden");
        status.innerHTML = '<div class="notice ok"><h2>Check your email</h2><p>We sent a confirmation link to <b>' + esc(d.email) +
          "</b>. Open it to confirm your address. Your access request has been recorded and will be reviewed after that.</p></div>";
      } else BOOT();
    });
    onSubmit($("#p-in"), async (d) => { await DB.signIn(d.email, d.password); location.href = "#database"; });
    $("#forgot").onclick = async (e) => {
      e.preventDefault();
      const email = $("#i-email").value.trim();
      if (!email) { toast("Type your email above first, then choose this again.", true); return; }
      try { await DB.resetPassword(email); toast("Password reset link sent to " + email); }
      catch (err) { toast(err.message, true); }
    };
    return;
  }

  // ---------- Signed in: show where the request stands ----------
  let req = null;
  try { req = await DB.myRequest(); } catch (e) {}
  const admin = user.role === "admin";
  let html = '<div class="panel"><h2>' + esc(user.full_name || user.email) + '</h2><p class="muted">' + esc(user.email) + "</p>";

  if (admin) {
    html += '<div class="notice ok"><p>You are a portal admin.</p></div><p><a class="btn" href="#admin">Open admin</a> <a class="btn ghost" href="#database">Search the data</a></p>';
  } else if (req && req.status === "approved") {
    html += '<div class="notice ok"><p>Your access was approved' + (req.reviewed_at ? " on " + fmtDate(req.reviewed_at) : "") + '.</p></div><p><a class="btn" href="#database">Search the data</a></p>';
  } else if (req && req.status === "pending") {
    html += '<div class="notice"><p>Your request from ' + fmtDate(req.created_at) + " is waiting for review. A person on our team reads every request, so this can take a few days.</p></div>";
  } else {
    html += (req ? '<div class="notice bad"><p>Your last request was not approved.' + (req.admin_note ? " Note from the team: " + esc(req.admin_note) : "") + "</p></div>" : "") +
      '<form id="again"><h3>Send a new request</h3>' +
      '<div class="field"><label for="a-aff">Organisation or institute</label><input id="a-aff" name="affiliation" required></div>' +
      '<div class="field"><label for="a-purpose">What will you use the data for?</label><textarea id="a-purpose" name="purpose" required minlength="20"></textarea></div>' +
      '<button class="btn" type="submit">Send access request</button></form>';
  }
  html += '<p style="margin:24px 0 0"><button class="btn ghost sm" id="out" type="button">Sign out</button></p></div>';
  status.innerHTML = html;

  $("#out").onclick = async () => { await DB.signOut(); location.href = "#index"; };
  if ($("#again")) onSubmit($("#again"), async (d) => { await DB.requestAgain(d); BOOT(); });
})();
},
  submit: function () {(async function () {
  const user = await ready;
  const form = $("#obs"), done = $("#done");

  SPECIES.forEach(([name, sci]) => {
    const o = document.createElement("option"); o.value = name; o.textContent = name + " (" + sci + ")";
    $("#s-species").appendChild(o);
  });
  $("#s-date").max = new Date().toISOString().slice(0, 10);
  if (user) { $("#s-name").value = user.full_name || ""; $("#s-email").value = user.email || ""; }

  $("#locate").addEventListener("click", () => {
    if (!navigator.geolocation) { toast("This device cannot share its location. Type the coordinates instead.", true); return; }
    navigator.geolocation.getCurrentPosition(
      (p) => { $("#s-lat").value = p.coords.latitude.toFixed(5); $("#s-lng").value = p.coords.longitude.toFixed(5); toast("Location added"); },
      () => toast("Location was not shared. Type the coordinates or leave them empty.", true),
      { enableHighAccuracy: true, timeout: 10000 });
  });

  onSubmit(form, async (d) => {
    if (d.website) return; // filled only by spam bots
    const file = $("#s-photo").files[0] || null;
    if (file && file.size > 10 * 1024 * 1024) throw new Error("That photo is larger than 10 MB. Choose a smaller one.");
    const num = (v) => (v === "" || v == null ? null : Number(v));
    if ((d.latitude === "") !== (d.longitude === "")) throw new Error("Give both latitude and longitude, or leave both empty.");
    await DB.submitObservation({
      name: d.name.trim(), email: d.email.trim(), kind: d.kind, species: d.species || null,
      obs_date: d.obs_date || null, place: d.place.trim(),
      latitude: num(d.latitude), longitude: num(d.longitude), bird_count: num(d.bird_count),
      notes: d.notes.trim() || null, consent: true
    }, file);
    form.reset(); form.classList.add("hidden"); done.classList.remove("hidden"); done.focus();
  });

  $("#another").addEventListener("click", () => { done.classList.add("hidden"); form.classList.remove("hidden"); $("#s-name").focus(); });
})();
},
  awareness: function () {(async function () {
  await ready;
  $("#mail").href = "mailto:" + PORTAL.CONTACT_EMAIL + "?subject=" + encodeURIComponent("Nightjar awareness material");
  let items = [];
  try { items = await DB.listMaterials(); } catch (e) {}
  if (!items.length) { $("#none").classList.remove("hidden"); return; }
  $("#materials").innerHTML = items.map((m) =>
    '<li><span class="tag">' + esc(m.kind) + (m.language ? ", " + esc(m.language) : "") + "</span>" +
    "<h3>" + esc(m.title) + "</h3><p>" + esc(m.description || "") + "</p>" +
    '<a class="btn sm" href="' + esc(safeUrl(m.file_url)) + '" target="_blank" rel="noopener">Open or download</a></li>').join("");
})();
},
  admin: function () {(async function () {
  const user = await ready;
  if (!user || user.role !== "admin") { $("#denied").classList.remove("hidden"); return; }
  $("#adm").classList.remove("hidden");

  // ---------- Tabs ----------
  document.querySelectorAll(".tabs [data-tab]").forEach((b) => b.addEventListener("click", () => {
    document.querySelectorAll(".tabs [data-tab]").forEach((x) => {
      const on = x === b; x.setAttribute("aria-selected", on);
      $("#t-" + x.dataset.tab).classList.toggle("hidden", !on);
    });
  }));

  const empty = (title, text) => '<li class="empty"><h3>' + title + "</h3><p>" + text + "</p></li>";
  const guard = async (fn) => { try { await fn(); } catch (e) { toast(e.message, true); } };

  // ---------- Access requests ----------
  async function loadRequests() {
    const rows = await DB.listRequests();
    const order = { pending: 0, approved: 1, rejected: 2 };
    rows.sort((a, b) => order[a.status] - order[b.status]);
    const pending = rows.filter((r) => r.status === "pending").length;
    $("#n-req").textContent = pending ? "(" + pending + " waiting)" : "";
    $("#requests").innerHTML = rows.length ? rows.map((r) =>
      '<li data-id="' + r.id + '"><div class="top"><span class="who">' + esc(r.full_name || "No name given") +
      ' <a class="small" href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a></span><span class="tag ' + r.status + '">' + r.status + "</span></div>" +
      '<p class="small muted">' + esc(r.affiliation || "No organisation given") + ", requested " + fmtDate(r.created_at) + "</p>" +
      "<p>" + esc(r.purpose || "No purpose given") + "</p>" +
      (r.admin_note ? '<p class="small muted">Your note: ' + esc(r.admin_note) + "</p>" : "") +
      '<div class="acts">' +
        (r.status !== "approved" ? '<button class="btn sm" data-act="approved">Approve</button>' : "") +
        (r.status !== "rejected" ? '<button class="btn sm danger" data-act="rejected">' + (r.status === "approved" ? "Remove access" : "Decline") + "</button>" : "") +
      "</div></li>").join("") : empty("No access requests yet", "New requests appear here as people sign up.");
  }
  $("#requests").addEventListener("click", (e) => guard(async () => {
    const act = e.target.dataset.act; if (!act) return;
    const id = Number(e.target.closest("li").dataset.id);
    let note = "";
    if (act === "rejected") { note = prompt("Optional note the person will see (leave empty for none):", ""); if (note === null) return; }
    await DB.setRequestStatus(id, act, note);
    toast(act === "approved" ? "Request approved" : "Request declined");
    await loadRequests();
  }));

  // ---------- Observations ----------
  let subs = [];
  async function loadSubs() {
    subs = await DB.listSubmissions();
    const fresh = subs.filter((s) => s.status === "new").length;
    $("#n-sub").textContent = fresh ? "(" + fresh + " new)" : "";
    $("#subs").innerHTML = subs.length ? subs.map((s) =>
      '<li data-id="' + s.id + '"><div class="top"><span class="who">' + esc(s.kind) + ": " + esc(s.species || "species not sure") +
      '</span><span class="tag ' + s.status + '">' + s.status + "</span></div>" +
      '<p class="small muted">From ' + esc(s.name) + ' <a href="mailto:' + esc(s.email) + '">' + esc(s.email) + "</a>, sent " + fmtDate(s.created_at) + "</p>" +
      "<p><b>" + esc(s.place || "") + "</b>" + (s.obs_date ? ", seen " + fmtDate(s.obs_date) : "") +
        (s.bird_count != null ? ", " + s.bird_count + " bird(s)" : "") +
        (s.latitude != null ? " (" + s.latitude + ", " + s.longitude + ")" : "") + "</p>" +
      (s.notes ? "<p>" + esc(s.notes) + "</p>" : "") +
      (s.photo_path ? '<div class="photo"><button class="btn ghost sm" data-photo="1">Show photo</button></div>' : "") +
      '<div class="acts">' +
        (s.status !== "accepted" ? '<button class="btn sm" data-act="accepted">Accept</button>' : "") +
        (s.status !== "rejected" ? '<button class="btn sm danger" data-act="rejected">Reject</button>' : "") +
      "</div></li>").join("") : empty("Nothing has been sent in yet", "Observations and photos from the public form appear here.");
  }
  $("#subs").addEventListener("click", (e) => guard(async () => {
    const li = e.target.closest("li"); if (!li) return;
    const id = Number(li.dataset.id);
    if (e.target.dataset.photo) {
      const s = subs.find((x) => x.id === id);
      const url = await DB.photoUrl(s.photo_path);
      const img = new Image(); img.alt = "Photo sent by " + s.name; img.src = url;
      e.target.parentNode.replaceChildren(img);
    } else if (e.target.dataset.act) {
      await DB.setSubmissionStatus(id, e.target.dataset.act);
      toast("Marked as " + e.target.dataset.act); await loadSubs();
    }
  }));
  $("#export-subs").addEventListener("click", () => {
    if (!subs.length) { toast("There is nothing to download yet.", true); return; }
    const cols = ["id", "created_at", "status", "name", "email", "kind", "species", "obs_date", "place", "latitude", "longitude", "bird_count", "notes"];
    const cell = (v) => { v = v == null ? "" : String(v); if (/^[=+\-@]/.test(v)) v = "'" + v; return '"' + v.replace(/"/g, '""') + '"'; };
    const csv = [cols.join(",")].concat(subs.map((r) => cols.map((c) => cell(r[c])).join(","))).join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv" }));
    a.download = "nightjar-observations.csv"; a.click(); URL.revokeObjectURL(a.href);
  });

  // ---------- Awareness material ----------
  async function loadMats() {
    const rows = await DB.listMaterials();
    $("#mats").innerHTML = rows.length ? rows.map((m) =>
      '<li data-id="' + m.id + '"><div class="top"><span class="who">' + esc(m.title) + '</span><span class="tag">' + esc(m.kind) +
      (m.language ? ", " + esc(m.language) : "") + "</span></div>" +
      (m.description ? "<p>" + esc(m.description) + "</p>" : "") +
      '<div class="acts"><a class="btn ghost sm" href="' + esc(safeUrl(m.file_url)) + '" target="_blank" rel="noopener">Open</a>' +
      '<button class="btn sm danger" data-del="1">Remove</button></div></li>').join("")
      : empty("No material published yet", "Use the form above to add your first poster or leaflet.");
  }
  onSubmit($("#mat-form"), async (d, form) => {
    const file = $("#m-file").files[0] || null;
    if (!file && !d.url) throw new Error("Choose a file or paste a link.");
    await DB.addMaterial({ title: d.title.trim(), description: d.description.trim(), kind: d.kind, language: d.language, file, url: d.url || null });
    form.reset(); toast("Material published"); await loadMats();
  });
  $("#mats").addEventListener("click", (e) => guard(async () => {
    if (!e.target.dataset.del) return;
    if (!confirm("Remove this material from the public page?")) return;
    await DB.deleteMaterial(Number(e.target.closest("li").dataset.id));
    toast("Material removed"); await loadMats();
  }));

  await guard(loadRequests); await guard(loadSubs); await guard(loadMats);
})();
}
};
// Tiny router: each "page" is a template shown according to the address hash, e.g. #database
window.BOOT = function () {
  const name = location.hash.slice(1).split("?")[0] || "index";
  window.PAGE = PAGES[name] ? name : "index";
  document.body.querySelectorAll("body > header, body > main, body > footer, body > .demo-note, #toast").forEach((n) => n.remove());
  document.body.appendChild(document.getElementById("page-" + PAGE).content.cloneNode(true));
  APP(); PAGES[PAGE]();
  const hs = document.querySelector(".hero-search");
  if (hs) hs.addEventListener("submit", (e) => { e.preventDefault(); location.hash = "#database?q=" + encodeURIComponent(hs.q.value); });
  window.scrollTo(0, 0);
};
window.addEventListener("hashchange", () => { if (PAGES[location.hash.slice(1).split("?")[0]]) BOOT(); });
BOOT();
</script>
</body>
